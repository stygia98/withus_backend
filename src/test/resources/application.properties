# 테스트 전용 설정 (운영·로컬 실행에는 영향 없음)
# @SpringBootTest 는 @TestPropertySource 등 설정이 다른 클래스마다 새 스프링 컨텍스트를 만들고, 컨텍스트마다 Hikari 풀이 따로 있다.
# 기본값(최대 10, 유휴 10)으로는 컨텍스트가 8~10개만 돼도 PostgreSQL 기본 max_connections(100)를 넘어
# "remaining connection slots are reserved" 오류로 뒤쪽 테스트가 전부 실패한다. 풀을 작게 둔다
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
