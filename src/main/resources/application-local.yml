# 로컬 프로필: infra/.env 를 읽어 DB 접속 정보를 채운다 (파일이 없으면 OS 환경변수 사용)
spring:
  config:
    import: optional:file:../infra/.env[.properties]
  mail:
    # Mailpit SMTP
    host: localhost
    port: 1025
  flyway:
    # local 전용 시드(R__seed_local.sql, 반복 실행)는 db/migration/local 에 둔다 (DB_SCHEMA.md 9장)
    locations: classpath:db/migration,classpath:db/migration/local

withus:
  storage:
    type: local
    local-path: ./uploads
  sms:
    type: mock
  cookie:
    secure: false   # 로컬 http
