# 공통 설정. 비밀값은 환경변수로만 주입한다 (CLAUDE.md 7장)
spring:
  application:
    name: withus-backend
  profiles:
    active: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB 세션 타임존 고정 (PRD 2.4)
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  flyway:
    locations: classpath:db/migration
    # 담당별 번호 대역(V10~, V20~ ...)을 쓰므로 낮은 번호가 나중에 추가돼도 적용한다 (docs/workflow-git.md)
    out-of-order: true
  jackson:
    time-zone: Asia/Seoul
  task:
    scheduling:
      pool:
        size: 5
  servlet:
    multipart:
      max-file-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

ses:
  max-send-rate: 1

withus:
  sender:
    name: 위드어스
    phone: 02-000-0000
    unsubscribe-phone: 080-000-0000
    from-address: ${WITHUS_MAIL_FROM:hello@withus.local}   # 운영: SES에 인증한 이메일 주소
  tracking:
    base-url: ${WITHUS_PUBLIC_BASE_URL:http://localhost:8080}   # 메일 링크 기준 주소. 운영: Amplify 주소
    bot-click-seconds: 10
    bot-user-agent-keywords: bot,crawler,spider,scanner,preview
    burst-click-window-seconds: 1
    ip-salt: ${TRACKING_IP_SALT:}   # IP 해시 솔트. 비밀값이므로 환경변수로만 주입
  ai:
    type: gemini            # gemini | mock. local 프로필은 mock 이 기본 (WITHUS_AI_TYPE=gemini 로 실제 호출)
    gemini:
      api-key: ${GEMINI_API_KEY:}   # 비밀값이므로 환경변수로만 주입
      model: gemini-3.1-flash-lite   # 무료 등급 가장 가벼운 텍스트 모델 (TECH_STACK 5장)
      base-url: https://generativelanguage.googleapis.com/v1beta
      connect-timeout: 3s
      read-timeout: 30s
  send-window:
    start: "08:00"
    end: "20:50"
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 7d
  cookie:
    secure: true          # local 프로필에서만 false (http)
  owner:
    # 최초 OWNER 계정 (OWNER 가 없을 때만 1회 생성)
    email: ${OWNER_EMAIL:}
    password: ${OWNER_PASSWORD:}

springdoc:
  swagger-ui:
    # Swagger UI 가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 보낸다 (POST 테스트용)
    csrf:
      enabled: true
